name: CPU regression

on:
  push:
    paths:
      - 'navstack/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pytest.ini'
      - '.github/workflows/cpu-regression.yml'
  pull_request:
    paths:
      - 'navstack/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pytest.ini'
      - '.github/workflows/cpu-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    # Standard public-repository runner. No paid/larger runners, GPU,
    # persistent caches, uploaded artifacts or simulator installation.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
      RUN_CARLA: '0'
      RUN_CARLA_BRIDGE: '0'
      RUN_CARLA_TRAINING_RESUME: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install locked CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.lock.txt
          python -m pip check
      - name: Run CPU regression
        run: python -m pytest -q -m 'not carla' --junitxml=cpu-regression.xml
      - name: Record scope
        if: always()
        run: |
          echo '### CPU verification only' >> "$GITHUB_STEP_SUMMARY"
          echo 'Real lightweight vehicle integration, planning, QP/MPC and PPO tests are included. CARLA tests are excluded or explicitly disabled. This workflow is not CARLA training, real-time validation or research acceptance.' >> "$GITHUB_STEP_SUMMARY"
